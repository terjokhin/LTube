<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
	<!-- LTube: a red record with a play button for a label (style after Navidrome's vinyl icon) -->
	<g stroke="#1d1d1b" stroke-linecap="round" stroke-linejoin="round" fill="none">
		<circle cx="32" cy="32" r="29.5" fill="#e53935" stroke-width="3" />
		<!-- grooves -->
		<path d="M10.3 28.2 A22 22 0 0 1 31.2 10" stroke-width="2.6" />
		<path d="M16 26.2 A17 17 0 0 1 31.4 15" stroke-width="2.6" />
		<path d="M53.7 35.8 A22 22 0 0 1 32.8 54" stroke-width="2.6" />
		<path d="M48 37.8 A17 17 0 0 1 32.6 49" stroke-width="2.6" />
		<circle cx="10" cy="33.8" r="1.4" fill="#1d1d1b" stroke="none" />
		<circle cx="54" cy="30.2" r="1.4" fill="#1d1d1b" stroke="none" />
		<!-- label with a play button -->
		<circle cx="32" cy="32" r="10.5" fill="#fff" stroke-width="3" />
		<path d="M29 26.8 L29 37.2 L37.6 32 Z" fill="#e53935" stroke-width="1.6" />
	</g>
</svg>
